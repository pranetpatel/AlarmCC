<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fire Alarm AI Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #ff4c2b;
      --accent2: #ff7b5e;
      --text: #e8eaf0;
      --muted: #7a80a0;
      --user-bubble: #1e3a5f;
      --agent-bubble: #1e2b1a;
      --agent-border: #2d4a28;
      --radius: 14px;
      --font: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 20px;
    }
    .header-text h1 { font-size: 17px; font-weight: 700; }
    .header-text p  { font-size: 12px; color: var(--muted); margin-top: 1px; }

    .status-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #4caf50;
      margin-left: auto;
      box-shadow: 0 0 0 3px rgba(76,175,80,.2);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 3px rgba(76,175,80,.2); }
      50%      { box-shadow: 0 0 0 6px rgba(76,175,80,.05); }
    }

    /* ── Call ID bar ── */
    #callbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      flex-shrink: 0;
    }
    #callbar label { color: var(--muted); }
    #callbar input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 13px;
      width: 180px;
      outline: none;
    }
    #callbar input:focus { border-color: var(--accent); }
    #newCallBtn {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: .15s;
    }
    #newCallBtn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    #chat::-webkit-scrollbar { width: 5px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    .bubble-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    .bubble-row.user  { flex-direction: row-reverse; }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 15px;
      flex-shrink: 0;
    }
    .avatar.agent { background: var(--agent-border); }
    .avatar.user  { background: var(--user-bubble); }

    .bubble {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.agent {
      background: var(--agent-bubble);
      border: 1px solid var(--agent-border);
      border-bottom-left-radius: 4px;
    }
    .bubble.user {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
    }
    .bubble.typing {
      display: flex; gap: 5px; align-items: center;
      padding: 14px 18px;
    }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); animation: bounce .9s infinite; }
    .dot:nth-child(2) { animation-delay:.15s; }
    .dot:nth-child(3) { animation-delay:.3s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-7px)} }

    /* ── Bottom bar ── */
    #bottombar {
      padding: 16px 24px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* Text input row */
    #inputrow {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    #textInput {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      resize: none;
      height: 42px;
      line-height: 1.4;
      transition: border-color .15s;
    }
    #textInput:focus { border-color: var(--accent); }
    #sendBtn {
      background: var(--accent);
      border: none;
      color: #fff;
      border-radius: 10px;
      padding: 0 18px;
      font-size: 18px;
      cursor: pointer;
      transition: .15s;
      flex-shrink: 0;
    }
    #sendBtn:hover { background: var(--accent2); }
    #sendBtn:disabled { opacity: .4; cursor: not-allowed; }

    /* Voice controls */
    #voicerow {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    #micBtn {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
      display: grid; place-items: center;
      transition: .2s;
      flex-shrink: 0;
    }
    #micBtn:hover { border-color: var(--accent); }
    #micBtn.listening {
      border-color: var(--accent);
      background: rgba(255,76,43,.12);
      animation: micpulse 1s infinite;
    }
    @keyframes micpulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,76,43,.4); }
      50%      { box-shadow: 0 0 0 12px rgba(255,76,43,0); }
    }
    #micBtn.speaking {
      border-color: #4caf50;
      background: rgba(76,175,80,.1);
    }
    #micBtn:disabled { opacity: .35; cursor: not-allowed; }

    #voiceHint {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.4;
    }
    #voiceHint strong { color: var(--text); }

    #muteBtn {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: .15s;
    }
    #muteBtn:hover { border-color: var(--accent2); color: var(--accent2); }
    #muteBtn.muted { color: var(--accent); border-color: var(--accent); }

    /* ── Welcome empty state ── */
    #welcome {
      margin: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #welcome .big-icon { font-size: 52px; line-height: 1; }
    #welcome h2 { font-size: 20px; font-weight: 700; }
    #welcome p  { font-size: 14px; color: var(--muted); max-width: 320px; line-height: 1.6; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #333;
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <div class="logo">🔥</div>
  <div class="header-text">
    <h1>Fire Alarm AI Agent</h1>
    <p>Triage · Troubleshoot · Dispatch</p>
  </div>
  <div class="status-dot" title="Online"></div>
</header>

<div id="callbar">
  <label for="callerIdInput">Call ID</label>
  <input id="callerIdInput" type="text" placeholder="e.g. customer-001" />
  <button id="newCallBtn">+ New Call</button>
</div>

<div id="chat">
  <div id="welcome">
    <div class="big-icon">🎙️</div>
    <h2>Ready for your call</h2>
    <p>Enter a Call ID above, then press the mic button or type your message to begin.</p>
  </div>
</div>

<div id="bottombar">
  <div id="inputrow">
    <textarea id="textInput" placeholder="Type a message…" rows="1"></textarea>
    <button id="sendBtn" title="Send">➤</button>
  </div>
  <div id="voicerow">
    <button id="micBtn" title="Hold to speak / click to toggle">🎙️</button>
    <div id="voiceHint">
      <strong id="micStatus">Click mic to start listening</strong><br>
      Agent will speak responses aloud
    </div>
    <button id="muteBtn">🔊 Mute agent</button>
  </div>
</div>

<div id="toast"></div>

<script>
  // ─── State ────────────────────────────────────────────────
  let customerId = "";
  let isMuted = false;
  let isListening = false;
  let isSpeaking = false;
  let recognition = null;
  let currentAudio = null;

  // ─── Elements ─────────────────────────────────────────────
  const chat        = document.getElementById("chat");
  const welcome     = document.getElementById("welcome");
  const textInput   = document.getElementById("textInput");
  const sendBtn     = document.getElementById("sendBtn");
  const micBtn      = document.getElementById("micBtn");
  const muteBtn     = document.getElementById("muteBtn");
  const micStatus   = document.getElementById("micStatus");
  const callerInput = document.getElementById("callerIdInput");
  const newCallBtn  = document.getElementById("newCallBtn");
  const toast       = document.getElementById("toast");

  // ─── Call ID ──────────────────────────────────────────────
  function getCallerId() {
    return callerInput.value.trim() || "caller-" + Date.now();
  }

  callerInput.addEventListener("change", () => {
    customerId = getCallerId();
  });

  newCallBtn.addEventListener("click", () => {
    const id = "call-" + Date.now();
    callerInput.value = id;
    customerId = id;
    clearChat();
    showToast("New call started: " + id);
  });

  // ─── Chat helpers ─────────────────────────────────────────
  function clearChat() {
    chat.innerHTML = "";
    chat.appendChild(welcome);
    welcome.style.display = "";
  }

  function hideWelcome() {
    welcome.style.display = "none";
  }

  function addBubble(role, text) {
    hideWelcome();
    const row = document.createElement("div");
    row.className = "bubble-row " + (role === "user" ? "user" : "agent");

    const av = document.createElement("div");
    av.className = "avatar " + (role === "user" ? "user" : "agent");
    av.textContent = role === "user" ? "👤" : "🤖";

    const b = document.createElement("div");
    b.className = "bubble " + (role === "user" ? "user" : "agent");
    b.textContent = text;

    row.append(av, b);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return b;
  }

  function addTyping() {
    hideWelcome();
    const row = document.createElement("div");
    row.className = "bubble-row agent";
    row.id = "typingRow";

    const av = document.createElement("div");
    av.className = "avatar agent";
    av.textContent = "🤖";

    const b = document.createElement("div");
    b.className = "bubble agent typing";
    b.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    row.append(av, b);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const r = document.getElementById("typingRow");
    if (r) r.remove();
  }

  // ─── Toast ────────────────────────────────────────────────
  function showToast(msg, ms = 2400) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), ms);
  }

  // ─── Send message ─────────────────────────────────────────
  async function sendMessage(text) {
    text = text.trim();
    if (!text) return;

    if (!customerId) {
      customerId = getCallerId();
      callerInput.value = customerId;
    }

    addBubble("user", text);
    textInput.value = "";
    sendBtn.disabled = true;
    micBtn.disabled = true;
    addTyping();

    try {
      const res = await fetch("/process-call", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ customerId, message: text }),
      });
      const data = await res.json();
      removeTyping();

      if (data.success) {
        addBubble("agent", data.agentResponse);
        speak(data.agentResponse);
      } else {
        addBubble("agent", "⚠️ Error: " + (data.error || "Unknown error"));
      }
    } catch (err) {
      removeTyping();
      addBubble("agent", "⚠️ Could not reach server. Is it running?");
    } finally {
      sendBtn.disabled = false;
      micBtn.disabled = false;
    }
  }

  // ─── Text input handling ──────────────────────────────────
  sendBtn.addEventListener("click", () => sendMessage(textInput.value));
  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage(textInput.value);
    }
  });

  // ─── TTS via server (agent speaking) ─────────────────────
  function stopAudio() {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
    isSpeaking = false;
    micBtn.classList.remove("speaking");
    micBtn.textContent = "🎙️";
  }

  async function speak(text) {
    if (isMuted) return;

    stopAudio();
    isSpeaking = true;
    micBtn.classList.add("speaking");
    micBtn.textContent = "🔊";

    try {
      const res = await fetch("/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });

      if (!res.ok) throw new Error("TTS request failed: " + res.status);

      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const audio = new Audio(url);
      currentAudio = audio;

      audio.onended = () => { URL.revokeObjectURL(url); stopAudio(); };
      audio.onerror = () => { URL.revokeObjectURL(url); stopAudio(); };

      audio.play();
    } catch (err) {
      console.error("TTS error:", err);
      stopAudio();
      // Fallback: device speechSynthesis if server TTS fails
      if ("speechSynthesis" in window) {
        const utter = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utter);
      }
    }
  }

  muteBtn.addEventListener("click", () => {
    isMuted = !isMuted;
    muteBtn.textContent = isMuted ? "🔇 Unmute agent" : "🔊 Mute agent";
    muteBtn.classList.toggle("muted", isMuted);
    if (isMuted) { stopAudio(); window.speechSynthesis?.cancel(); }
    showToast(isMuted ? "Agent voice muted" : "Agent voice on");
  });

  // ─── Speech Recognition (user speaking) ──────────────────
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    micBtn.disabled = true;
    micStatus.textContent = "Voice not supported in this browser (use Chrome)";
  } else {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = "en-US";

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add("listening");
      micBtn.textContent = "⏹";
      micStatus.textContent = "Listening…";
      stopAudio();
      window.speechSynthesis?.cancel();
    };

    recognition.onresult = (e) => {
      let interim = "", final = "";
      for (const r of e.results) {
        if (r.isFinal) final += r[0].transcript;
        else interim += r[0].transcript;
      }
      textInput.value = final || interim;
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove("listening");
      micBtn.textContent = "🎙️";
      micStatus.textContent = "Click mic to start listening";

      const transcript = textInput.value.trim();
      if (transcript) {
        sendMessage(transcript);
      }
    };

    recognition.onerror = (e) => {
      isListening = false;
      micBtn.classList.remove("listening");
      micBtn.textContent = "🎙️";
      if (e.error === "not-allowed") {
        micStatus.textContent = "Microphone access denied";
        showToast("Please allow microphone access in your browser");
      } else if (e.error !== "no-speech") {
        micStatus.textContent = "Voice error: " + e.error;
      } else {
        micStatus.textContent = "Click mic to start listening";
      }
    };

    micBtn.addEventListener("click", () => {
      if (isSpeaking) { stopAudio(); window.speechSynthesis?.cancel(); return; }
      if (isListening) {
        recognition.stop();
      } else {
        textInput.value = "";
        recognition.start();
      }
    });
  }
</script>
</body>
</html>
